<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富景花園 巴士到站時間</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f5f5f7; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0053a0; margin-top: 0; margin-bottom: 5px; }
        .station-name { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        button { width: 100%; padding: 14px; background-color: #ffcc00; color: #003366; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:active { background-color: #e6b800; }
        .result-item { background: #f8fafc; padding: 14px 16px; margin-top: 10px; border-left: 5px solid #0053a0; border-radius: 6px; }
        .route { font-weight: bold; font-size: 17px; }
        .eta { float: right; color: #2f855a; font-weight: bold; font-size: 16px; text-align: right; }
        .error { color: #e53e3e; text-align: center; margin-top: 15px; font-weight: bold; }
        .loading { text-align: center; margin-top: 15px; color: #4a5568; }
    </style>
</head>
<body>
<div class="container">
    <h2>富景花園 巴士查詢</h2>
    <div class="station-name">📍 富景花園, 小西灣道</div>
    
    <button onclick="getStationAllETA()">🔄 重新整理</button>
    
    <div id="loading" class="loading" style="display:none;">正在連線...</div>
    <div id="results"></div>
</div>

<script>
async function getStationAllETA() {
    const resultsDiv = document.getElementById('results');
    const loadingDiv = document.getElementById('loading');
    resultsDiv.innerHTML = '';
    loadingDiv.style.display = 'block';

    const myProxyUrl = 'https://lingering-snow-f7bd.ken-au-hk.workers.dev/';
    const targetUrl = 'https://rt.data.gov.hk/v1/transport/batch/stop-eta/CTB/001370';

    try {
        const response = await fetch(`${myProxyUrl}?url=${encodeURIComponent(targetUrl)}`);
        if (!response.ok) throw new Error('連線失敗');
        
        const resData = await response.json();
        loadingDiv.style.display = 'none';

        if (resData.data && resData.data.length > 0) {
            const now = new Date();
            const routeMap = {};

            resData.data.forEach(item => {
                if (!item.eta) return;
                const mins = Math.max(0, Math.floor((new Date(item.eta) - now) / 60000));
                const key = item.route + '|' + (item.dest || '');

                if (!routeMap[key]) {
                    routeMap[key] = { route: item.route, dest: item.dest || '', etas: [] };
                }
                routeMap[key].etas.push(mins);
            });

            const routeList = Object.values(routeMap)
                .map(r => { r.etas.sort((a,b)=>a-b); return r; })
                .sort((a,b) => a.etas[0] - b.etas[0]);

            routeList.forEach(bus => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'result-item';

                const next1 = bus.etas[0] + ' 分鐘';
                const next2 = bus.etas[1] !== undefined ? bus.etas[1] + ' 分鐘' : '—';

                const isMain = bus.route === '788' ? 'style="color:#d9381e"' : '';

                itemDiv.innerHTML = `
                    <span class="route" ${isMain}>${bus.route} 往 ${bus.dest}</span>
                    <span class="eta">${next1}<br><small style="font-weight:normal;color:#718096">${next2}</small></span>
                `;
                resultsDiv.appendChild(itemDiv);
            });
            
        } else {
            resultsDiv.innerHTML = '<div class="error">目前沒有即將到站的巴士</div>';
        }
    } catch (error) {
        loadingDiv.style.display = 'none';
        resultsDiv.innerHTML = `<div class="error">讀取失敗: ${error.message}</div>`;
    }
}

window.onload = getStationAllETA;
</script>
</body>
</html>
